<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <title>Система за Фактуриране - Онлайн Инсталация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .logo {
            max-width: 180px;
            margin-bottom: 25px;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 18px;
            color: white;
            background-color: #28a745;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- СНИМКАТА (ЛОГОТО), КОЯТО КЛИЕНТЪТ ВИЖДА НА ЕКРАНА -->
        <img class="logo" src="https://placeholder.com" alt="Фирмено Лого">
        
        <h2>Инсталиране на Софтуер</h2>
        <p>Кликнете върху бутона по-долу, за да стартирате директната онлайн инсталация на вашата система.</p>
        
        <!-- ДИРЕКТНИЯТ КЛИКОНС ЛИНК КЪМ АПЛИКАЦИЯТА -->
        <a class="btn" href="Invoice.application">СТАРТИРАЙ ИНСТАЛАЦИЯТА</a>
    </div>

</body>
</html>
